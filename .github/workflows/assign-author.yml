name: Assign author

# Assigns each new pull request to the person who opened it. pull_request_target runs
# this file from the default branch with a write token, so it works for pull requests
# from forks too; it never checks out the pull request's code, so nothing from a fork
# runs with that token.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign-author:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Assign the author
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: gh api "repos/$REPO/issues/$NUMBER/assignees" -f "assignees[]=$AUTHOR" --silent
